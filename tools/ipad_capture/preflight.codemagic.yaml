# Copy to root codemagic.yaml ONLY in the isolated preflight branch.
workflows:
  ipad-simulator-preflight:
    name: Credential-free iPad simulator preflight
    instance_type: mac_mini_m2
    max_build_duration: 5
    environment:
      xcode: 26.6
    scripts:
      - name: Bounded host, runtime inventory and optional simulator boot
        script: |
          set -eu
          python3 "$CM_BUILD_DIR/tools/ipad_capture/preflight.py"
    artifacts:
      - /tmp/sc-simulator-preflight/result.json
      - /tmp/sc-simulator-preflight/*.stdout.txt
      - /tmp/sc-simulator-preflight/*.stderr.txt
# No environment groups, Flutter setup, triggers, signing, publishing or app actions.
