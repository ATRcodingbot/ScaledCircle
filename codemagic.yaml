workflows:
  recover-ios33-upload-only:
    name: Recover original iOS33 - validate and upload only
    instance_type: mac_mini_m2
    max_build_duration: 20
    integrations:
      app_store_connect: Codemagic ScaledCircle
    environment:
      groups:
        - ios33_artifact_recovery
      xcode: 26.6
    scripts:
      - name: Recover and verify original signed artifact; never compile
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "Recovery CI revision: $(git rev-parse HEAD)"
          git checkout --detach 2fd8b501f8abb0eedae87017f0ffbc36c51cbbc5
          test "$(git rev-parse HEAD)" = 2fd8b501f8abb0eedae87017f0ffbc36c51cbbc5
          python3 - <<'PY'
          import hashlib, os, urllib.request, urllib.error
          from pathlib import Path
          assert hashlib.sha256(Path('apps/mobile/pubspec.lock').read_bytes()).hexdigest() == '2d929b3279125c2a0732212aee86ebf51607aaff76f315c9a0ff51e0bbf8ea94'
          req = urllib.request.Request('https://api.codemagic.io/artifacts/59bd9083-fac3-4cbd-b33f-9ecc2363ffc4/4ba7017d-91b5-47f2-84fc-91d104924b7b/ScaledCircle.ipa', headers={'x-auth-token': os.environ['IOS33_RECOVERY_ARTIFACT_TOKEN']})
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()
          except urllib.error.HTTPError as error:
              raise SystemExit('Original artifact retrieval HTTP status ' + str(error.code)) from None
          assert hashlib.sha256(data).hexdigest() == '701e9b82a8bf904a38b24469413c84cf9507771d271185cf763e6c5cac1649af', 'Original IPA hash mismatch'
          Path('recovered-ios33.ipa').write_bytes(data)
          print('Original IPA hash verified. Application source 2fd8b501f8abb0eedae87017f0ffbc36c51cbbc5. No compilation.')
          PY
          python3 tools/verify_ios_production_bundle.py recovered-ios33.ipa --version 1.0.0 --build 33 --environment production
          python3 tools/verify_native_branding.py --ipa recovered-ios33.ipa
          python3 tools/verify_ios_push.py recovered-ios33.ipa
          python3 - <<'PY'
          import subprocess, tempfile, zipfile
          from pathlib import Path
          with zipfile.ZipFile('recovered-ios33.ipa') as archive:
              binary = archive.read('Payload/Runner.app/Frameworks/App.framework/App')
              for marker in ['https://www.openstreetmap.org/copyright', 'OpenStreetMap contributors', 'Could not open the map licence. Please try again.', 'until_revoked', 'store_review', 'mobileNotificationsV1']:
                  assert any(marker.encode(enc) in binary for enc in ('utf-8', 'utf-16-le', 'utf-16-be')), marker
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(['ditto', '-x', '-k', 'recovered-ios33.ipa', directory], check=True)
              apps = list((Path(directory) / 'Payload').glob('*.app'))
              assert len(apps) == 1
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(apps[0])], check=True)
              result = subprocess.run(['codesign', '-dvv', str(apps[0])], capture_output=True, text=True, check=True)
              assert 'Authority=Apple Distribution:' in result.stderr
              assert 'TeamIdentifier=4RXFR4Q2SA' in result.stderr
          print('Original signed iOS33 production/branding/push/attribution gates PASS')
          PY
    artifacts:
      - recovered-ios33.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
