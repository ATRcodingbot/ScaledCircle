{
  "workflows": {
    "recover-ios39-upload-only": {
      "name": "Recover original iOS39 - complete validation and upload only",
      "instance_type": "mac_mini_m2",
      "max_build_duration": 30,
      "integrations": {
        "app_store_connect": "Codemagic ScaledCircle"
      },
      "environment": {
        "groups": [
          "ios39_artifact_recovery"
        ],
        "xcode": "26.6"
      },
      "scripts": [
        {
          "name": "Validate exact retained iOS39; never compile or re-sign",
          "script": "#!/bin/bash\nset -euo pipefail\ncd \"$CM_BUILD_DIR\"\nexport IOS39_TOOLING_REVISION=\"$(git rev-parse HEAD)\"\necho \"Release-validation tooling: $IOS39_TOOLING_REVISION\"\ngit checkout --detach d60920930c81253f9019c19bed47a3eaf184dd3e\ngit archive \"$IOS39_TOOLING_REVISION\" tools | tar -x\ntest \"$(git rev-parse HEAD)\" = d60920930c81253f9019c19bed47a3eaf184dd3e\ngit diff --exit-code -- apps/mobile\npython3 tools/recover_ios39_artifact.py --download\n"
        }
      ],
      "artifacts": [
        "validated/recovered-ios39.ipa",
        "ios39-validation.safe.json"
      ],
      "publishing": {
        "app_store_connect": {
          "auth": "integration",
          "submit_to_testflight": false,
          "submit_to_app_store": false
        }
      }
    }
  }
}
