# Template: copy to root codemagic.yaml ONLY in an isolated capture CI branch.
# Codemagic does not discover this nested path. Preserve the release branch root.
workflows:
  ipad-reviewer-capture:
    name: iPad simulator screenshots - source c66388d - no distribution
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      xcode: 26.6
      groups:
        - ipad_capture_reviewer
    scripts:
      - name: Bounded simulator compile, install and Core capture
        script: |
          set -eu
          bash "$CM_BUILD_DIR/tools/ipad_capture/run.sh"
    # The runner writes these during execution, with a 24-minute work budget.
    # Reserve the remaining cap for bounded cleanup and provider artifact export.
    # Hard termination can still prevent export; safe milestones also reach CI logs.
    artifacts:
      - /tmp/sc-ipad-capture-output/*.png
      - /tmp/sc-ipad-capture-output/manifest.json
      - /tmp/sc-ipad-capture-output/diagnostics/*.png
      - /tmp/sc-ipad-capture-output/diagnostics/*.json
      - /tmp/sc-ipad-capture-status.json
# No signing integration, publishing, App Store upload, or build-number increment.
