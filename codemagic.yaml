{
  "workflows": {
    "recover-ios39-upload-only": {
      "name": "Recover original iOS39 - complete validation and upload only",
      "instance_type": "mac_mini_m2",
      "max_build_duration": 30,
      "integrations": {
        "app_store_connect": "Codemagic ScaledCircle"
      },
      "environment": {
        "groups": [
          "ios39_artifact_recovery"
        ],
        "xcode": "26.6"
      },
      "scripts": [
        {
          "name": "Validate exact retained iOS39; never compile or re-sign",
          "script": "#!/bin/bash\nset -euo pipefail\nexport TOOLING_DIR=\"$CM_BUILD_DIR\"\nexport APP_DIR=\"$(dirname \"$CM_BUILD_DIR\")/ios39-application\"\ncd \"$TOOLING_DIR\"\necho \"Release-validation tooling: $(git rev-parse HEAD)\"\npython3 \"$TOOLING_DIR/tools/recover_ios39_artifact.py\" --app-dir \"$APP_DIR\" --download"
        }
      ],
      "artifacts": [
        "validated/recovered-ios39.ipa",
        "ios39-validation.safe.json"
      ],
      "publishing": {
        "app_store_connect": {
          "auth": "integration",
          "submit_to_testflight": false,
          "submit_to_app_store": false
        }
      }
    }
  }
}
